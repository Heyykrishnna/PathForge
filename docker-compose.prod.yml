services:
  postgres:
    image: postgres:16-alpine
    container_name: pathforge-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pathforge_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurelyInProd!}
      POSTGRES_DB: ${POSTGRES_DB:-pathforge_prod}
    ports:
      - "5432:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathforge_admin} -d ${POSTGRES_DB:-pathforge_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pathforge-prod-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-pathforge_admin}:${POSTGRES_PASSWORD:-ChangeMeSecurelyInProd!}@postgres:5432/${POSTGRES_DB:-pathforge_prod}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-set-a-long-random-secret-for-production-jwt-access-tokens}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-set-a-long-random-secret-for-production-jwt-refresh-tokens}
      COOKIE_SECRET: ${COOKIE_SECRET:-set-a-long-random-secret-for-production-cookies}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pathforge-prod-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "3000:3000"

volumes:
  prod_postgres_data:

